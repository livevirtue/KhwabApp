<title>Khwab App Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Amiri:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: one phone frame, right-to-left, night-blue header with gold accents on a cool paper body. */
:root {
  --page: #dfe4ee; --paper: #f4f6fb; --card: #ffffff; --line: #d8deea;
  --ink: #18213a; --muted: #5d6784; --night: #16234a; --night-2: #22356b;
  --gold: #a27a12; --gold-soft: #f3e7c4; --on-night: #f1e6c6;
  --warn-bg: #fbe9d6; --warn-fg: #8a4513; --ok: #1f7a4d;
  /* English letters use Calibri (or its free twin Carlito); Urdu letters fall through to Nastaleeq. */
  --ur: "Calibri", "Carlito", "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", serif;
  --ar: "Amiri", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #070b16; --paper: #0e1428; --card: #161e38; --line: #26305a;
  --ink: #e7eaf5; --muted: #9aa3c4; --night: #0a1230; --night-2: #1a2a5c;
  --gold: #e3c063; --gold-soft: #3a3016; --on-night: #f1e6c6;
  --warn-bg: #3d2614; --warn-fg: #f3c191; --ok: #6fd3a0; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #070b16; --paper: #0e1428; --card: #161e38; --line: #26305a;
  --ink: #e7eaf5; --muted: #9aa3c4; --night: #0a1230; --night-2: #1a2a5c;
  --gold: #e3c063; --gold-soft: #3a3016; --on-night: #f1e6c6;
  --warn-bg: #3d2614; --warn-fg: #f3c191; --ok: #6fd3a0; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--ur); margin: 0; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.note { font-size: 13px; line-height: 2.2; color: var(--muted); text-align: center; margin: 0 auto 10px; max-width: 400px; }
.phone { direction: rtl; max-width: 400px; height: min(840px, calc(100% - 40px)); min-height: 580px; margin: 0 auto; background: var(--paper);
  border: 1px solid var(--line); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgb(10 20 50 / .18); }
@media (max-width: 440px) { body { padding-block: 6px; } .phone { border-radius: 16px; height: calc(100% - 44px); } }

.top { background: linear-gradient(160deg, var(--night), var(--night-2)); color: var(--on-night); padding: 12px 14px 14px; display: flex; align-items: center; gap: 8px; position: relative; }
.top h1 { margin: 0; font-size: 20px; font-weight: 700; flex: 1; line-height: 2.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .moon { width: 34px; height: 34px; flex: none; }
.ib { border: 0; background: transparent; color: inherit; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.ib:hover { background: rgb(255 255 255 / .12); }
.ib svg { width: 22px; height: 22px; }
.screen { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }

.search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 8px 0; line-height: 2.2; }
.search:focus-within { border-color: var(--gold); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }

.cta { border: 0; border-radius: 18px; padding: 12px 16px; background: var(--gold-soft); color: var(--ink); font: inherit; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.cta b { font-size: 17px; display: block; line-height: 2; }
.cta span { font-size: 13px; color: var(--muted); line-height: 2; }
.cta .wa { width: 40px; height: 40px; border-radius: 50%; background: #1fa855; color: #fff; display: grid; place-items: center; flex: none; }

.h { font-size: 14px; color: var(--muted); margin: 0; line-height: 2; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 6px 4px; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
.cat:hover { border-color: var(--gold); }
.cat i { font-style: normal; font-size: 22px; line-height: 1.4; }
.cat span { font-size: 12.5px; line-height: 2; }

.hadith { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; position: relative; overflow: hidden; }
.hadith::before { content: ""; position: absolute; inset: 0 0 auto auto; width: 70px; height: 70px; background: radial-gradient(circle at 70% 30%, var(--gold-soft) 0 40%, transparent 41%); opacity: .8; }
.hadith p { margin: 0; line-height: 2.3; font-size: 15px; position: relative; }
.ref { font-size: 12px; color: var(--gold); direction: ltr; display: inline-block; line-height: 2; }
details.topic { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
details.topic[open] { border-color: var(--gold); }
details.topic summary { cursor: pointer; list-style: none; padding: 4px 14px; font-size: 16px; font-weight: 600; line-height: 2.4; display: flex; align-items: center; gap: 10px; }
details.topic summary::-webkit-details-marker { display: none; }
details.topic summary .n { width: 28px; height: 28px; border-radius: 50%; background: var(--night); color: var(--on-night); display: grid; place-items: center; font-size: 13px; flex: none; line-height: 1; }
details.topic summary::after { content: "⌄"; margin-right: auto; color: var(--muted); }
details.topic[open] summary::after { content: "⌃"; }
.topic-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.topic-body p { margin: 0; line-height: 2.4; font-size: 15px; }
.topic-body .ayah { font-family: var(--ar); font-size: 21px; line-height: 2; color: var(--gold); text-align: center; }
.topic-body .refs { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.weak { color: var(--warn-fg); font-size: 12px; }

.row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; cursor: pointer; }
.row:hover { border-color: var(--gold); }
.row .w { flex: 1; min-width: 0; }
.row b { font-size: 17px; line-height: 2.2; }
.row small { display: block; color: var(--muted); font-size: 12px; line-height: 2; direction: ltr; text-align: right; }
.row .arw { font-family: var(--ar); font-size: 20px; color: var(--gold); }
.letters { display: flex; flex-wrap: wrap; gap: 6px; }
.letters button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; line-height: 1; }
.letters button[aria-pressed="true"] { background: var(--night); color: var(--on-night); border-color: var(--night); }

.sym { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
.sym .big { font-size: 34px; font-weight: 700; line-height: 2; }
.sym .arabic { font-family: var(--ar); font-size: 24px; color: var(--gold); }
.sym small { display: block; color: var(--muted); font-size: 12px; line-height: 2; }
.book { background: var(--card); border: 1px solid var(--line); border-right: 4px solid var(--gold); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.book h3 { margin: 0; font-size: 15px; color: var(--gold); line-height: 2; }
.book p { margin: 0; line-height: 2.3; font-size: 15px; }
details.orig summary { cursor: pointer; font-size: 13px; color: var(--muted); line-height: 2; }
details.orig p { font-family: var(--ar); font-size: 17px; line-height: 2; color: var(--muted); }
.sample { display: inline-block; background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 0 8px; font-size: 12px; line-height: 2; align-self: flex-start; }
.alert { background: var(--warn-bg); color: var(--warn-fg); border-radius: 14px; padding: 10px 14px; line-height: 2.2; font-size: 14px; }

form { display: flex; flex-direction: column; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.f input, .f textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; line-height: 2.2; }
.f textarea { min-height: 120px; resize: vertical; }
.f input:focus, .f textarea:focus { border-color: var(--gold); outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 0 12px; line-height: 2.3; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--night); color: var(--on-night); border-color: var(--night); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 2.1; }
.check input { margin-top: 10px; accent-color: var(--gold); }
.send { border: 0; border-radius: 14px; background: #1fa855; color: #fff; font: inherit; font-size: 16px; padding: 4px; line-height: 2.4; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.send:disabled { opacity: .45; cursor: not-allowed; }
.btn2 { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; padding: 4px; line-height: 2.3; cursor: pointer; }
.msg { white-space: pre-wrap; background: #dcf8c6; color: #111; border-radius: 12px 0 12px 12px; padding: 8px 12px; line-height: 2.1; font-size: 14px; }
.steps { margin: 0; padding-right: 20px; display: flex; flex-direction: column; gap: 4px; line-height: 2.2; }
.prose p { margin: 0; line-height: 2.3; }

.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11.5px; padding: 6px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; line-height: 2; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--gold); font-weight: 700; }
.nav .mid svg { width: 28px; height: 28px; color: #1fa855; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(36px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); font-family: var(--ur); padding: 2px 16px; border-radius: 999px; font-size: 14px; line-height: 2.2; direction: rtl; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* Urdu paragraphs: tall Nastaleeq lines, justified, clear gaps between paragraphs. */
.book p, .topic-body p, .prose p, .hadith p, .problem p { font-size: 16px; line-height: 2.6; text-align: justify; text-align-last: right; word-spacing: .06em; margin: 0; }
.book p + p, .topic-body p + p, .prose p + p { margin-top: .5em; }
.book { gap: 6px; padding: 12px 16px; }
.orig { border-top: 1px dashed var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.orig .h { font-size: 13px; }
.book .orig p { font-family: var(--ar); font-size: 18px; line-height: 2.1; color: var(--ink); }
.row .arname { font-family: var(--ar); font-size: 20px; line-height: 2; }
.count { font-size: 13px; color: var(--muted); margin: 0; }
.ref, .row small, .sym small { font-family: "Calibri", "Carlito", system-ui, sans-serif; font-size: 12.5px; }

/* Final look */
:root { --shadow: 0 1px 2px rgb(16 28 64 / .06), 0 6px 18px rgb(16 28 64 / .07); }
.top { padding: 14px 14px 18px;
  background-image: radial-gradient(1.2px 1.2px at 20% 30%, rgb(255 255 255 / .55) 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 20%, rgb(255 255 255 / .45) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 45% 75%, rgb(255 255 255 / .4) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 65%, rgb(255 255 255 / .5) 50%, transparent 51%),
    linear-gradient(160deg, var(--night), var(--night-2)); }
.top .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top .tt h1 { flex: none; }
.top .sub { font-size: 12.5px; opacity: .8; line-height: 1.9; margin-top: -4px; }
.search { box-shadow: var(--shadow); border-radius: 16px; }
.row, .cat, .book, .hadith, .sym, details.topic, .cta { box-shadow: var(--shadow); border-color: transparent; }
.row:hover, .cat:hover { border-color: var(--gold); }
.cat { border-radius: 16px; padding: 10px 6px 6px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { font: inherit; font-size: 14px; line-height: 2.2; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.qchip:hover { border-color: var(--gold); color: var(--gold); }
.cta { background: linear-gradient(135deg, var(--gold-soft), var(--card)); }
a.send { text-decoration: none; }
.nav { box-shadow: 0 -4px 16px rgb(16 28 64 / .06); border-top-color: transparent; }
.nav button[aria-current="page"] svg { background: var(--gold-soft); border-radius: 999px; padding: 2px 12px; box-sizing: content-box; }
.about { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; border-top: 4px solid var(--gold); }
.about p { margin: 0; line-height: 2.4; font-size: 15px; }
.about-head { display: flex; align-items: center; gap: 12px; }
.about-head .mono { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(160deg, var(--night), var(--night-2)); color: var(--on-night); display: grid; place-items: center; font-size: 26px; line-height: 1; flex: none; }
.about-head b { display: block; font-size: 19px; line-height: 2; }
.about-head span { font-size: 13px; color: var(--muted); line-height: 1.8; }
.about-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.linkbtn { display: grid; place-items: center; text-decoration: none; color: var(--ink); font-family: "Calibri", "Carlito", sans-serif; }
@media (max-width: 360px) { .about-links { grid-template-columns: 1fr; } }
</style>

<p class="note">قابلِ کلک نمونہ۔ نابلسی کی مکمل کتاب (۲۳۹۱ علامات) مکمل عربی متن کے ساتھ؛ ۹۲ کا اردو ترجمہ ہو چکا، باقی جاری ہے۔</p>

  if (d.letter) { S.letter = S.letter === d.letter ? null : d.letter; return render(); }
  if (t.hasAttribute("data-back")) { if (S.sym) S.sym = null; else S.cat = null; return render(); }
  if (d.fav) { S.favs.has(d.fav) ? S.favs.delete(d.fav) : S.favs.add(d.fav); try { localStorage.setItem("kfavs", JSON.stringify([...S.favs])); } catch (e) {} toast(S.favs.has(d.fav) ? "پسندیدہ میں شامل" : "پسندیدہ سے نکال دیا"); return render(); }
  if (t.hasAttribute("data-share")) return toast("ایپ میں اینڈرائیڈ کا شیئر مینو کھلے گا");
  if (d.seg) { S.form[d.seg] = S.form[d.seg] === d.val ? "" : d.val; if (d.seg === "feel") S.badAck = false; return render(); }
  if (t.hasAttribute("data-badno")) { S.form.feel = ""; S.tab = "home"; toast("اللہ آپ کو ہر شر سے محفوظ رکھے"); return render(); }
  if (t.hasAttribute("data-badyes")) { S.badAck = true; return render(); }
  if (t.hasAttribute("data-reset")) { S.sent = false; S.badAck = false; S.form = { name: "", gender: "", age: "", status: "", time: "", feel: "", text: "", ok: false }; return render(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.sym) { S.sym = ev.target.dataset.sym; render(); } });
document.addEventListener("submit", ev => { ev.preventDefault(); S.sent = true; render(); });
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (id === "q") { S.q = ev.target.value; render(); }
  else if (id === "f-name") S.form.name = ev.target.value;
  else if (id === "f-text") { S.form.text = ev.target.value; refreshSend(); }
  else if (id === "f-ok") { S.form.ok = ev.target.checked; refreshSend(); }
});
document.addEventListener("change", ev => { if (ev.target.id === "f-ok") { S.form.ok = ev.target.checked; refreshSend(); } });
function refreshSend() {
  const f = S.form, b = document.querySelector(".send"), c = document.querySelector("#f-text + .ref");
  if (b) b.disabled = !(f.text.trim().length >= 20 && f.ok && f.gender && f.feel);
  if (c) c.textContent = `${f.text.trim().length} / 1500 (کم از کم 20)`;
}
render();
</script>
